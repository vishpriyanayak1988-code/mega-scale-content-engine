name: Publish Package to npm
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          CLEAN_TOKEN=$(echo -n "${{ secrets.NPM_TOKEN }}" | tr -d '[:space:]')
          echo "//registry.npmjs.org/:_authToken=${CLEAN_TOKEN}" > ~/.npmrc
          npm publish --access public
